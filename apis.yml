aid: curai
name: Curai
description: >-
  Curai Health is a virtual-first primary care company offering 24/7 text-based
  telemedicine to patients across all 50 U.S. states, connecting them with
  board-certified clinicians for urgent care, chronic disease management,
  wellness, and preventive screenings, with orders for labs and prescriptions
  and referrals to specialists. For organizations, health systems, TPAs, and
  benefits administrators, Curai exposes a Partner API and an embeddable Web SDK
  (curai-js) that let partners register patients and drop the Curai patient
  experience into their own web and mobile apps, plus integration via
  standards-based APIs, Health Information Exchanges (HIE), and webhooks. The
  Partner API is a small, key-authenticated surface used to onboard patients and
  obtain session access tokens for the embedded experience.
